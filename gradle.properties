# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Rust / NDK paths (override via environment or local.properties)
# ndk.dir=/path/to/ndk
# rust.target.aarch64=aarch64-linux-android
# rust.target.x86_64=x86_64-linux-android

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ── Version ────────────────────────────────────────────────────────────────
# versionCode: bump manually before each release (monotonic integer)
# versionName: semver string displayed in the UI
VERSION_CODE=1
VERSION_NAME=1.0.0
